<style>
:root{
  --bg:#fff;--ink:#1b2125;--sub:#37424a;
  --main:#2f5be0;--deep:#13265a;--pale:#e5edfc;--soft:#f1f5fe;--line:#cfdcf6;--lab:#86a1ea;
  --alert:#d6335a;--alertbg:#fdecf1;
  --r:6px;
  --ease:cubic-bezier(.22,.7,.2,1);
  interpolate-size:allow-keywords;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.8}
a{color:var(--main)}

/* ---------- 表紙 ---------- */
.hero{background:var(--pale);padding:44px 20px 40px;text-align:center}
.mark{display:block;width:152px;height:152px;margin:0 auto 16px}
.org{margin:0;font-size:1rem;font-weight:700;letter-spacing:.14em;color:var(--deep)}
h1{margin:2px 0 0;font-size:clamp(1.9rem,6.4vw,2.7rem);line-height:1.35;font-weight:700;letter-spacing:.1em;color:var(--deep)}
.next{display:flex;align-items:center;gap:12px;max-width:600px;margin:26px auto 0;width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.next:hover{transform:translateY(-2px);border-color:var(--lab);box-shadow:0 6px 16px rgba(30,50,110,.10)}
.nlab{flex:none;background:var(--main);color:#fff;font-size:.74rem;font-weight:700;border-radius:3px;padding:1px 9px;line-height:1.6}
.ndate{flex:none;font-weight:700;color:var(--main);font-size:.92rem}
.ntitle{min-width:0;flex:1;overflow:hidden;white-space:nowrap;font-weight:700;font-size:.92rem}
.ntitle.run{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.mq{display:inline-flex}
.mt{flex:none;padding-right:48px}
.ntitle.run .mq{animation:marq var(--d,12s) linear infinite}
.next:hover .ntitle.run .mq{animation-play-state:paused}
.narr{flex:none;color:var(--main);font-size:1.3rem;line-height:1}
.hero>*{animation:rise .8s var(--ease) both}
.hero .mark{animation-name:pop;animation-duration:.9s;animation-delay:.05s}
.hero .org{animation-delay:.15s}
.hero h1{animation-delay:.22s}
.hero .next{animation-delay:.4s}

/* ---------- 重要なお知らせ ---------- */
.alertwrap{display:flex;flex-direction:column;gap:8px;max-width:760px;margin:20px auto 0;padding:0 20px}
.alertbar{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--alert);border-radius:var(--r);background:var(--alertbg);color:var(--ink);text-align:left;font:inherit;padding:10px 16px;cursor:pointer;animation:rise .6s var(--ease) both;transition:background .3s}
.alertbar:hover{filter:brightness(.98)}
.alertbar .tg{flex:none;background:var(--alert);color:#fff;font-size:.74rem;font-weight:700;border-radius:3px;padding:1px 9px;line-height:1.6}
.alertbar .at{min-width:0;flex:1;font-weight:700;font-size:.93rem;line-height:1.6;white-space:normal;overflow-wrap:anywhere}
.alertbar .arr{flex:none;color:var(--alert);font-size:1.3rem;line-height:1}
.alertbar.notice{border-color:#a35f00;background:#fff4de}
.alertbar.notice .tg{background:#a35f00}
.alertbar.notice .arr{color:#a35f00}

/* ---------- ナビ（パソコン：上に固定／スマホ：下に固定） ---------- */
.nav{position:sticky;top:0;z-index:30;margin-top:20px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{position:relative;display:flex;justify-content:center;max-width:760px;margin:0 auto}
.nav a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 22px;color:var(--deep);font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;transition:color .3s}
.nav a:hover,.nav a[aria-current="true"]{color:var(--main)}
.nav a:focus-visible{outline:2px solid var(--main);outline-offset:-4px}
.ti svg{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ind{position:absolute;z-index:2;left:0;bottom:-1px;height:3px;width:0;background:var(--main);transition:transform .45s var(--ease),width .45s var(--ease)}

/* ---------- 各セクション ---------- */
.sec{max-width:760px;margin:0 auto;padding:56px 20px 0;scroll-margin-top:36px}
h2{position:relative;margin:0 0 22px;padding-bottom:12px;font-size:1.5rem;line-height:1.4;font-weight:700;letter-spacing:.06em;color:var(--deep);border-bottom:1px solid var(--line)}
h2::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:3px;background:var(--main)}
.empty{color:var(--sub);padding:12px 0}

.js .rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0) * 60ms)}
.js .rv.in{opacity:1;transform:none}

/* お知らせ */
.nitem{padding:16px 2px;border-bottom:1px solid var(--line)}
.nhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.nd{font-size:.88rem;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.tag{font-size:.74rem;font-weight:700;color:#fff;background:var(--alert);border-radius:3px;padding:0 9px;line-height:1.6}
.tag.notice{background:#a35f00}
/* 「詳細はこちら」ボタン */
.more{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--main);border-radius:6px;padding:5px 18px;color:var(--main);background:#fff;font-weight:700;font-size:.92rem;text-decoration:none;transition:background .3s,color .3s,transform .35s var(--ease)}
.more:hover{background:var(--main);color:#fff;transform:translateY(-2px)}
.more span{transition:transform .35s var(--ease)}
.more:hover span{transform:translate(2px,-2px)}
.mr{margin-top:10px;white-space:normal}
dl .mr{grid-column:1/-1;margin-top:8px}
a.al{color:var(--main);font-weight:700;text-decoration:underline;text-underline-offset:3px;word-break:break-all;transition:color .3s}
a.al::after{content:"↗";font-size:.8em;margin-left:2px}
a.al:hover{color:var(--deep)}
.nt{font-weight:700}
.nb{margin:4px 0 0;font-size:.95rem;color:var(--ink);white-space:pre-line}

/* 予定・Q＆A（＋でひらく） */
details{border-bottom:1px solid var(--line)}
details::details-content{block-size:0;overflow:clip;transition:block-size .4s var(--ease),content-visibility .4s allow-discrete}
details[open]::details-content{block-size:auto}
details[open]>dl,details[open]>.ans,details[open]>.pastin{animation:fade .5s ease both}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:16px;padding:16px 2px;transition:color .3s}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--main)}
summary::after{content:"+";flex:none;margin-left:auto;width:28px;text-align:center;color:var(--main);font-size:1.6rem;font-weight:300;line-height:1;transition:transform .4s var(--ease)}
details[open]>summary::after{transform:rotate(45deg)}
summary:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.sd{flex:none;min-width:7.4em;color:var(--main);font-weight:700;font-size:.95rem}
.st{font-weight:700}
dl{margin:0 0 16px;padding:14px 18px;background:var(--soft);border-radius:var(--r);display:grid;grid-template-columns:5em 1fr;gap:4px 14px;font-size:.95rem}
dt{color:var(--sub);font-size:.88rem;font-weight:700}
dd{margin:0;white-space:pre-line}
.ans{margin:0 0 16px;padding:14px 18px;background:var(--soft);border-radius:var(--r);font-size:.95rem;white-space:pre-line}
.faq summary::before{content:"Q";flex:none;color:var(--main);font-weight:700;font-size:1.05rem;width:1.1em}
.past{margin-top:18px;border-bottom:0}
.past>summary{color:var(--sub);font-weight:700;font-size:.92rem;padding:10px 2px}
.past>summary::after{font-size:1.3rem}
.past .sd{color:var(--sub)}

/* リンク */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 36px}
.lk{display:flex;align-items:center;gap:12px;padding:16px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:color .3s,padding .35s var(--ease)}
.lk:hover{color:var(--main);padding-left:8px}
.lt{min-width:0;flex:1}
.ln{display:block;font-weight:700;line-height:1.5}
.ld{display:block;font-size:.86rem;color:var(--sub)}
.go{flex:none;color:var(--main);font-size:1.05rem;transition:transform .35s var(--ease)}
.lk:hover .go{transform:translate(2px,-2px)}

/* 連絡先 */
.who{font-weight:700;font-size:1.15rem;margin-bottom:14px}
.cb{display:flex;gap:12px;flex-wrap:wrap}
.cb a{display:inline-block;border:1px solid var(--main);border-radius:var(--r);padding:10px 30px;font-weight:700;text-decoration:none;transition:background .3s,color .3s,transform .35s var(--ease)}
.cb a.fill{background:var(--main);color:#fff}
.cb a.line{background:#fff;color:var(--main)}
.cb a:hover{transform:translateY(-2px)}
.cb a.fill:hover{background:var(--deep);border-color:var(--deep)}
.cb a.line:hover{background:var(--soft)}
.addr{margin:14px 0 0;font-size:.9rem;color:var(--sub);word-break:break-all}

.sk{height:60px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}

/* 先頭へ戻るボタン */
.totop{position:fixed;right:20px;bottom:24px;z-index:40;width:60px;height:60px;border:0;border-radius:8px;background:var(--main);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:.7rem;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 6px 18px rgba(20,38,90,.3);opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .4s,visibility .4s,transform .45s var(--ease),background .3s}
.totop.show{opacity:1;visibility:visible;transform:none}
.totop.show:hover{background:var(--deep);transform:translateY(-3px)}
.totop svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
.totop:hover svg{transform:translateY(-3px)}
.totop:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
main{padding-bottom:40px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes marq{to{transform:translateX(calc(-1 * var(--w)))}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

@media(max-width:720px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .totop{right:14px;bottom:calc(64px + env(safe-area-inset-bottom) + 14px);width:54px;height:54px}
  .hero{padding:32px 16px 32px}
  .alertwrap{padding:0 12px}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;background:var(--main);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(20,30,80,.18)}
  .navin{max-width:none}
  .nav a{flex:1 1 0;flex-direction:column;gap:2px;padding:8px 2px 7px;color:#fff;font-size:.72rem}
  .nav a:hover{color:#fff}
  .nav a[aria-current="true"]{color:#fff;background:rgba(255,255,255,.18)}
  .ti svg{display:block}
  .ind{top:0;bottom:auto;background:#fff;border-radius:0 0 3px 3px}
  .sec{padding-top:44px;scroll-margin-top:8px}
  .grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .next.wide{flex-wrap:wrap;row-gap:4px}
  .next.wide .narr{order:2;margin-left:auto}
  .next.wide .ntitle{order:3;flex:1 1 100%}
  .mark{width:128px;height:128px}
  .next{padding:9px 12px;gap:8px}
  .ndate{font-size:.85rem}
  .ntitle{font-size:.85rem}
  h2{font-size:1.3rem}
  summary{flex-wrap:wrap;gap:2px 10px;padding-right:34px;position:relative}
  summary::after{position:absolute;right:0;top:50%;margin-top:-14px}
  .sd{min-width:0;flex:0 0 100%;font-size:.85rem}
  dl{grid-template-columns:1fr;gap:0}
  dt{margin-top:6px}
  .alertbar{padding:9px 12px;gap:8px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ntitle{text-overflow:ellipsis}
  .mq{display:block;overflow:hidden;text-overflow:ellipsis}
  .mt{display:inline;padding:0}
  .mt+.mt{display:none}
  .ntitle.run{-webkit-mask-image:none;mask-image:none}
  .js .rv{opacity:1;transform:none}
}
.ic,.pill{display:none}

/* ===== 案B：枠付きカード（v14の見せ方） ===== */
:root{--r:10px}
#news .nitem{background:var(--soft);border:0;border-radius:10px;padding:16px 22px;margin-bottom:12px;transition:transform .35s var(--ease),box-shadow .35s}
#news .nitem:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,50,110,.08)}
#news .nitem.imp{background:var(--alertbg)}
#news .nitem.ntc{background:#fff4de}
#news .nd{background:#fff;border-radius:4px;padding:0 13px;line-height:1.7;color:var(--main)}
#schedule details{border:2px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;transition:border-color .3s,box-shadow .35s}
#schedule details:hover{border-color:var(--lab)}
#schedule details[open]{box-shadow:0 6px 18px rgba(30,50,110,.08)}
#schedule summary{padding:14px 18px}
#schedule summary::after{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid var(--main);border-radius:4px;font-size:1.1rem;font-weight:700;transition:transform .4s var(--ease),background .3s,color .3s}
#schedule summary:hover::after{background:var(--main);color:#fff}
#schedule .sd{min-width:5.8em;text-align:center;background:var(--main);color:#fff;border-radius:4px;padding:4px 10px}
#schedule dl{margin:0;border-radius:0;padding:14px 22px 18px}
#schedule details.past{border:0;border-radius:0;overflow:visible;margin-top:20px;box-shadow:none}
#schedule .past>summary{padding:10px 2px}
#schedule .past>summary::after{border:0;width:28px;font-size:1.3rem}
#schedule .past>.pastin{padding:8px 0 0}
#schedule details[open]>summary::after{content:"−";transform:none}
#schedule details.past[open]>summary::after{content:"−"}
#schedule .past .sd{background:var(--sub);color:#fff}
#links .grid{grid-template-columns:repeat(3,1fr);gap:16px}
#links .lk{display:block;border:2px solid var(--line);border-radius:10px;padding:24px 14px 20px;text-align:center;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s}
#links .lk:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(30,50,110,.13);border-color:var(--main);padding-left:14px}
#links .ic{display:flex;width:68px;height:68px;margin:0 auto 12px;border-radius:10px;background:var(--soft);color:var(--main);align-items:center;justify-content:center;transition:transform .4s var(--ease)}
#links .lk:hover .ic{transform:scale(1.08) rotate(-3deg)}
#links .ic svg{width:34px;height:34px}
#links .go{display:none}
#links .pill{display:inline-block;margin-top:14px;border:2px solid var(--main);color:var(--main);border-radius:6px;padding:3px 24px;font-weight:700;font-size:.88rem;transition:background .3s,color .3s}
#links .lk:hover .pill{background:var(--main);color:#fff}
@media(max-width:640px){
  #links .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  #links .lk{padding:20px 10px 16px}
  #links .ic{width:58px;height:58px}
  #links .ic svg{width:30px;height:30px}
}
@media(max-width:560px){
  #schedule .sd{flex:0 0 auto;min-width:0;font-size:.85rem}
  #schedule summary{padding:12px 44px 12px 14px}
  #schedule summary::after{right:10px}
  #schedule .past>summary{padding:10px 34px 10px 2px}
  #schedule .past>summary::after{right:0}
  #schedule dl{padding:12px 14px 16px}
}
/* おまけ：ほうきのアイコン */
.egg-wrap{position:fixed;left:0;bottom:0;z-index:35;display:flex;align-items:center;gap:4px;height:38px;padding:0 16px 0 8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.egg{width:30px;height:30px;padding:0;border:0;background:none;color:var(--main);opacity:.35;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s,transform .45s var(--ease)}
.egg svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.egg:hover,.egg:focus-visible{opacity:.85;transform:rotate(-12deg)}
.views{font-size:.8rem;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.fx{position:fixed;inset:0;z-index:100;cursor:pointer;touch-action:none}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fxmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:92vw;text-align:center;pointer-events:none;opacity:0}
.fxmsg.show{opacity:1}
.fxlogo{display:block;width:120px;height:120px;margin:0 auto 8px;border-radius:50%;box-shadow:0 8px 28px rgba(20,38,90,.28)}
.fxbig{font-size:clamp(2.3rem,10vw,4.4rem);line-height:1.25;font-weight:900;letter-spacing:.06em;color:var(--deep);-webkit-text-stroke:10px #fff;paint-order:stroke fill}
.fxsub{display:inline-block;max-width:min(92vw,560px);margin-top:8px;padding:5px 20px;line-height:1.5;border-radius:6px;background:var(--main);color:#fff;font-weight:700;font-size:1.05rem}
.fxmsg.show .fxlogo{animation:spinin 1s var(--ease) both}
.fxmsg.show .fxbig{animation:bigpop .7s cubic-bezier(.3,1.6,.5,1) .15s both}
.fxmsg.show .fxsub{animation:rise .6s var(--ease) .5s both}
@keyframes spinin{from{opacity:0;transform:rotate(-360deg) scale(.2)}to{opacity:1;transform:none}}
@keyframes bigpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@media(max-width:720px){
  .egg-wrap{right:0;height:calc(32px + env(safe-area-inset-bottom));padding:0 12px 0 6px;padding-bottom:env(safe-area-inset-bottom);border-right:0;border-radius:0;background:#fff}
  .nav{bottom:calc(32px + env(safe-area-inset-bottom));padding-bottom:0}
  body{padding-bottom:calc(64px + 32px + env(safe-area-inset-bottom))}
  .totop{bottom:calc(64px + 32px + env(safe-area-inset-bottom) + 14px)}
}
</style>

/* 「詳細はこちら」ボタン：シートの「リンク」列（URL）と、任意の「リンク名」列から作る */
function moreLink(x){
  const u = String((x && x.url) || "").trim();
  if (!/^https?:\/\//i.test(u)) return "";
  const label = String((x && x.label) || "").trim() || "詳細はこちら";
  return `<a class="more" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}<span aria-hidden="true">↗</span></a>`;
}

/* 本文の中の http:// や https:// で始まる文字を、押せるリンクにする（それ以外の文字は、そのまま表示） */
const URL_RE = /(https?:\/\/[^\s<>"'）)」』、。，]+)/g;
function shortUrl(u){ const t = u.replace(/^https?:\/\//, "").replace(/\/$/, ""); return t.length > 44 ? t.slice(0, 43) + "…" : t; }
function linkify(s){
  return String(s == null ? "" : s).split(URL_RE).map((p, i) =>
    i % 2 ? `<a class="al" href="${esc(p)}" target="_blank" rel="noopener noreferrer" title="${esc(p)}">${esc(shortUrl(p))}</a>` : esc(p)).join("");
}

/* ---------- ふわっと現れる動き ---------- */
const io = ("IntersectionObserver" in window)
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px", threshold:.05})
  : null;
function stagger(el){
  [...el.children].forEach((c, i) => {
    c.classList.add("rv"); c.style.setProperty("--i", Math.min(i, 6));
    if (io) io.observe(c); else c.classList.add("in");
  });
}

function renderNews(list){
  const rank = n => n.important ? 2 : n.notice ? 1 : 0;   // 重要 → 注目 → ふつう の順（同じ種類の中は、日付の新しい順のまま）
  list = (list || []).slice().sort((a, b) => rank(b) - rank(a));
  $("newsList").innerHTML = list.length
    ? list.map(n => `<div class="nitem${n.important ? " imp" : n.notice ? " ntc" : ""}"><div class="nhead"><span class="nd">${esc(n.date)}</span>${n.important ? '<span class="tag">重要</span>' : n.notice ? '<span class="tag notice">注目</span>' : ''}<span class="nt">${esc(n.title)}</span></div>${n.body ? `<p class="nb">${linkify(n.body)}</p>` : ''}${moreLink(n) ? `<div class="mr">${moreLink(n)}</div>` : ''}</div>`).join("")
    : '<p class="empty">いまのところ、お知らせはありません。</p>';

}
function schedItem(s, open){
  const dl = (s.details || []).map(d => `<dt>${esc(d[0])}</dt><dd>${linkify(d[1])}</dd>`).join("");

}
function renderSchedule(list){

/* 「次の予定」：題名が入りきらないときは、流れるメッセージにする */
let lastTitle = "";
function setMarquee(text){
  lastTitle = text;
  const box = $("nTitleBox"), mq = $("nTitle");
  box.classList.remove("run");
  mq.style.animation = "none";
  mq.innerHTML = '<span class="mt"></span>';
  mq.firstChild.textContent = text;
  requestAnimationFrame(() => {
    if ($("next").hidden) return;
    const w = mq.firstChild.offsetWidth;   // 文字の幅＋余白48px
    if (w - 48 > box.clientWidth + 1){
      const g = document.createElement("span");
      g.className = "mt"; g.setAttribute("aria-hidden", "true"); g.textContent = text;
      mq.appendChild(g);
      mq.style.setProperty("--w", w + "px");
      mq.style.setProperty("--d", Math.round(w / 45) + "s");
      box.classList.add("run");
    }
    mq.style.animation = "";
  });
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (lastTitle) setMarquee(lastTitle); }, 200); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (lastTitle) setMarquee(lastTitle); });

  $("impBar").hidden = !imp; $("notBar").hidden = !ntc;

function showViews(n){
  const el = $("views"); if (!el) return;
  if (typeof n === "number" && isFinite(n)){ el.textContent = "" + n.toLocaleString("ja-JP"); el.hidden = false; } else el.hidden = true;
}
/* 同じ端末は、30分に1回だけ数える。URLの末尾に ?nocount を付けて開くと、その端末は数えなくなる（?count で戻る） */
function wantHit(){
  try {
    if (/[?&]nocount/.test(location.search)) localStorage.setItem("kct-nocount", "1");
    if (/[?&]count(&|$)/.test(location.search)) localStorage.removeItem("kct-nocount");
    if (localStorage.getItem("kct-nocount")) return false;
    return Date.now() - (Number(localStorage.getItem("kct-hit")) || 0) > 30 * 60 * 1000;
  } catch (e) { return true; }
}
function renderAll(d){
  renderNews(d.news); renderSchedule(d.schedule); renderFaq(d.faq); renderHighlights(d); showViews(d.views);
}

/* ---------- スプレッドシートの読み込み ---------- */
function skeleton(){
  const sk = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  $("newsList").innerHTML = sk; $("schedList").innerHTML = sk; $("faqList").innerHTML = sk;
}
function failed(){
  const m = '<p class="empty">情報を読み込めませんでした。<br>通信環境を確認して、ページを開き直してください。</p>';
  $("newsList").innerHTML = m; $("schedList").innerHTML = m; $("faqList").innerHTML = m;
  $("alertWrap").hidden = true; $("next").hidden = true;
}
function load(){
  if (!API_URL){ renderAll(SAMPLE); return; }
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}
  if (cached) renderAll(cached); else skeleton();
  const hit = wantHit();
  fetch(API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") + (hit ? "hit=1" : "v=1"), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      if (!d || !Array.isArray(d.news) || !Array.isArray(d.schedule) || !Array.isArray(d.faq)) throw new Error("bad data");
      renderAll(d);
      if (hit){ try { localStorage.setItem("kct-hit", String(Date.now())); } catch (e) {} }
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
    })
    .catch(() => { if (!cached) failed(); });
}

/* メニューを押した直後は、押した項目を強調したままにする（ページの末尾で、押した場所が上まで来ない場合のため）。
   自分でスクロールし始めたら解除する */
let lock = null;
function setCurrent(id){
  if (id === current) return;
  current = id;
  SECS.forEach(([k]) => { const a = $("n-" + k); if (k === id) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  moveInd();
}
function spy(){
  $("toTop").classList.toggle("show", window.scrollY > 500);
  if (lock) return;
  const mobile = window.matchMedia("(max-width:720px)").matches;
  const line = mobile ? 120 : $("nav").offsetHeight + 80;
  let id = null;
  SECS.forEach(([k]) => { if ($(k).getBoundingClientRect().top <= line) id = k; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) id = SECS[SECS.length - 1][0];
  setCurrent(id);
}
navin.addEventListener("click", e => { const a = e.target.closest("a"); if (a){ lock = a.id.slice(2); setCurrent(lock); } });
["wheel","touchstart","keydown","mousedown"].forEach(ev => window.addEventListener(ev, () => { lock = null; }, {passive:true}));
let ticking = false;
window.addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, {passive:true});
window.addEventListener("resize", () => { moveInd(); spy(); });

function goTo(id){ const el = $(id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goTo(b.dataset.go)));

    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-depth, 0); ctx.lineTo(-depth - 420, -52); ctx.lineWidth = Math.max(6, bh * 0.05); ctx.strokeStyle = "#8d5a2b"; ctx.stroke();
    ctx.fillStyle = "#b57b3e"; rr(-depth, -half, depth * 0.65, half * 2, 5); ctx.fill();
    ctx.fillStyle = "#2f5be0"; ctx.fillRect(-depth * 0.4, -half, depth * 0.1, half * 2);
    const x0 = -depth * 0.3, x1 = depth * 0.7;
    ctx.fillStyle = "#e8c76a"; ctx.fillRect(x0, -half, x1 - x0, half * 2);
    ctx.strokeStyle = "#c79a3a"; ctx.lineWidth = 1.6;
    for (let yy = -half + 5; yy < half; yy += 6){ ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1 + ((yy * 7) % 5), yy); ctx.stroke(); }
    ctx.restore();
  }
  function star(x, y, r, rot){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4 - Math.PI / 2, rr2 = i % 2 ? r * 0.28 : r; ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr2, Math.sin(a) * rr2); }
    ctx.closePath(); ctx.restore();
  }

  let W, H, items, brooms, sparks, nb, bh, count, counts;
  function build(){
    W = innerWidth; H = innerHeight;
    nb = Math.max(4, Math.round(H / 150)); bh = H / nb;
    const sc = clamp(Math.min(W, H) / 620, 0.8, 1.3);
    count = clamp(Math.round(W * H / 17000), 26, 64);
    items = [];
    for (let i = 0; i < count; i++){
      const kd = KINDS[Math.floor(Math.random() * KINDS.length)], y = rnd(26, H - 26);
      items.push({ kind: kd[0], f: DRAW[kd[0]], c: kd[1][Math.floor(Math.random() * kd[1].length)], x: rnd(30, W - 30), y,
        rot: rnd(0, 6.28), spin: rnd(-4, 4), ds: rnd(0, 0.45), dur: rnd(0.45, 0.6), s: sc * rnd(0.9, 1.25),
        b: Math.min(nb - 1, Math.floor(y / bh)), k: rnd(6, 70) * sc });
    }
    if (Math.random() < 0.05){   /* ときどき、金の空き缶が混ざる */
      const y = rnd(40, H - 40);
      items.push({ kind: "gold", f: DRAW.gold, c: "", x: rnd(40, W - 40), y, rot: rnd(-0.4, 0.4), spin: rnd(-2, 2), ds: rnd(0, 0.4), dur: 0.55, s: sc * 1.3, b: Math.min(nb - 1, Math.floor(y / bh)), k: rnd(6, 40) * sc });
    }
    count = items.length; counts = {};
    items.forEach(it => { counts[it.kind] = (counts[it.kind] || 0) + 1; });
    brooms = [];
    for (let b = 0; b < nb; b++) brooms.push({ dir: b % 2 ? -1 : 1, start: 1.05 + b * 0.14, dur: 1.5 });
    sparks = [];
    for (let i = 0; i < 26; i++) sparks.push({ x: rnd(20, W - 20), y: rnd(20, H - 20), r: rnd(10, 26), ts: 3.0 + rnd(0, 1.1), life: rnd(0.6, 1.0), c: ["#f5b82e", "#ffffff", "#2f5be0", "#f5b82e"][i % 4] });
  }
  const M = 150;
  function front(b, t){
    const o = brooms[b], p = smooth(clamp((t - o.start) / o.dur, 0, 1));
    return o.dir > 0 ? -M + p * (W + 2 * M) : W + M - p * (W + 2 * M);
  }
  function draw(t){
    ctx.clearRect(0, 0, W, H);
    const a = Math.min(1, t / 0.35);
    ctx.fillStyle = "rgba(238,243,253," + a + ")"; ctx.fillRect(0, 0, W, H);
    const fadeDirt = clamp((t - 0.2) / 0.4, 0, 1);
    /* まだ掃いていない所は、少し汚れた色 */
    for (let b = 0; b < nb; b++){
      const f = front(b, t), o = brooms[b];
      ctx.fillStyle = "rgba(120,105,80," + (0.15 * fadeDirt) + ")";
      const y0 = Math.floor(b * bh), h = Math.ceil(bh) + 1;
      if (o.dir > 0){ const x0 = clamp(f, 0, W); ctx.fillRect(x0, y0, W - x0, h); } else { const x1 = clamp(f, 0, W); ctx.fillRect(0, y0, x1, h); }
    }
    /* ほこり */
    for (let b = 0; b < nb; b++){
      const o = brooms[b];
      for (let j = 0; j < 40; j++){
        const ts = o.start + j * 0.036, age = (t - ts) / 0.7;
        if (age < 0 || age > 1) continue;
        const f = front(b, ts), r1 = Math.sin(j * 12.9 + b * 4.1) * 0.5 + 0.5;
        ctx.beginPath(); ctx.arc(f - o.dir * (30 + age * 24), (b + 0.15 + r1 * 0.7) * bh - age * 18, 6 + age * 16, 0, 7);
        ctx.fillStyle = "rgba(255,255,255," + (0.55 * (1 - age)) + ")"; ctx.fill();
      }
    }
    /* ごみ */
    for (let i = 0; i < items.length; i++){
      const it = items[i], o = brooms[it.b], f = front(it.b, t);
      let x = it.x, y, rot = it.rot, hop = 0;
      const p = clamp((t - it.ds) / it.dur, 0, 1);
      if (t < it.ds) continue;
      y = -80 + (it.y + 80) * p * p;
      if (p < 1) rot += it.spin * (1 - p) * 2;
      else { const tb = t - it.ds - it.dur; if (tb < 0.22) y -= 14 * Math.sin(tb * Math.PI / 0.22) * (1 - tb / 0.22); }
      const lead = Math.max(22, bh * 0.2) * 0.7 + it.k;
      if (o.dir > 0 && x < f + lead){ const d = f + lead - x; x = f + lead; rot += d * 0.025; hop = Math.abs(Math.sin(d * 0.05)) * 10; }
      if (o.dir < 0 && x > f - lead){ const d = x - (f - lead); x = f - lead; rot -= d * 0.025; hop = Math.abs(Math.sin(d * 0.05)) * 10; }
      if (x < -60 || x > W + 60) continue;
      ctx.save(); ctx.translate(x, y - hop); ctx.rotate(rot); ctx.scale(it.s, it.s); it.f(it.c); ctx.restore();
    }
    /* ほうき */
    for (let b = 0; b < nb; b++){
      const o = brooms[b], f = front(b, t);
      if (t < o.start || t > o.start + o.dur + 0.05) continue;
      broom(f, (b + 0.5) * bh, o.dir, bh, t, b);
    }
    /* きらきら */
    for (let i = 0; i < sparks.length; i++){
      const s = sparks[i], u = (t - s.ts) / s.life;
      if (u < 0 || u > 1) continue;
      star(s.x, s.y, s.r * Math.sin(u * Math.PI), u * 1.4);
      ctx.fillStyle = s.c; ctx.fill();
      if (s.c === "#ffffff"){ ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(47,91,224,.5)"; ctx.stroke(); }
    }
  }

  /* 「ごみ○個 回収」まわりの言葉。条件に合うものから、毎回ちがうものを選ぶ */
  const UNIT = { can: ["空き缶", "個"], bottle: ["ペットボトル", "本"], paper: ["紙くず", "個"], leaf: ["落ち葉", "枚"], wrap: ["お菓子の袋", "枚"], boot: ["長靴", "足"], gold: ["金の空き缶", "個"] };
  function makeSub(){
    const n = count, cn = counts, now = new Date(), m = now.getMonth() + 1, hh = now.getHours();
    const f = k => UNIT[k][0] + " " + cn[k] + UNIT[k][1];
    if (cn.gold) return "★ 金の空き缶を発見！ 今日は、いいことがあるかも";
    let times = 1;
    try { times = (Number(localStorage.getItem("kct-egg")) || 0) + 1; localStorage.setItem("kct-egg", String(times)); } catch (err) {}
    if ([10, 30, 50, 100].indexOf(times) >= 0) return times + "回目！ そうじ名人です（ごみ " + n + "個 回収）";
    const keys = Object.keys(cn).filter(k => cn[k] > 0 && k !== "gold").sort((a, b) => cn[b] - cn[a]);
    const zone = hh < 5 ? "夜ふかし" : hh < 10 ? "朝" : hh < 15 ? "昼" : hh < 18 ? "夕方" : "夜";
    const season = m >= 3 && m <= 5 ? "春のおだやかな日" : m >= 6 && m <= 8 ? "暑い中" : m >= 9 && m <= 11 ? "秋風の中" : "寒い中";
    const rank = n < 33 ? "見習い隊員" : n < 42 ? "頼れる隊員" : n < 52 ? "ベテラン隊員" : "清掃隊長";
    const T = [
      () => "ごみ " + n + "個 回収！",
      () => "ごみ " + n + "個 回収！",
      () => keys.slice(0, 3).map(f).join("・") + (keys.length > 3 ? " ほか" : ""),
      () => "いちばん多かったのは " + UNIT[keys[0]][0] + "（" + cn[keys[0]] + UNIT[keys[0]][1] + "）",
      () => cn.boot ? "なぜか 長靴も " + cn.boot + "足 落ちていました" : null,
      () => cn.leaf ? "落ち葉 " + cn.leaf + "枚。" + (m >= 9 && m <= 11 ? "秋ですね" : "季節を感じます") : null,
      () => "ほうき " + nb + "本で、ごみ " + n + "個 回収！",
      () => "5秒で " + n + "個 回収！ はやい！",
      () => zone + "のおそうじ、おつかれさま！（" + n + "個）",
      () => season + "、ごみ " + n + "個 回収！",
      () => "称号：" + rank + "（ごみ " + n + "個）",
      () => times >= 2 ? times + "回目のおそうじ！ ごみ " + n + "個" : "はじめてのおそうじ！ ごみ " + n + "個",
      () => "きれい度 100％！ ごみ " + n + "個 回収",
      () => cn.can && cn.bottle ? "空き缶 " + cn.can + "個 と ペットボトル " + cn.bottle + "本。分別もばっちり！" : null
    ];
    let pick = null, guard = 0;
    while (pick === null && guard++ < 30){
      const i = Math.floor(Math.random() * T.length); if (i === lastSub) continue;
      const s = T[i](); if (s !== null){ pick = s; lastSub = i; }
    }
    return pick || "ごみ " + n + "個 回収！";
  }
  function finish(){
    if (done) return; done = true;
    cancelAnimationFrame(raf); clearTimeout(timer);
    fx.style.transition = "opacity .45s"; fx.style.opacity = "0";
    setTimeout(() => { fx.hidden = true; msgBox.classList.remove("show"); running = false; }, 480);
  }
  function start(){
    if (running) return;
    running = true; done = false;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    build();
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    $("fxlogo").src = document.querySelector(".mark").src;
    let bi; do { bi = Math.floor(Math.random() * MSGS.length); } while (bi === lastBig && MSGS.length > 1);
    lastBig = bi; $("fxbig").textContent = MSGS[bi];
    $("fxsub").textContent = makeSub();
    msgBox.classList.remove("show"); void msgBox.offsetWidth;
    fx.style.transition = "none"; fx.style.opacity = "1"; fx.hidden = false;
    if (reduce){
      ctx.fillStyle = "rgb(238,243,253)"; ctx.fillRect(0, 0, W, H);
      msgBox.classList.add("show"); timer = setTimeout(finish, 2600); return;
    }
    const T = 5.0; let t0 = 0, shown = false;
    function frame(now){
      if (done) return;
      if (!t0) t0 = now;
      const t = (now - t0) / 1000;
      draw(t);
      if (t > 3.2 && !shown){ shown = true; msgBox.classList.add("show"); }
      if (t >= T){ finish(); return; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }
  btn.addEventListener("click", start);
  fx.addEventListener("click", finish);
  window.addEventListener("keydown", e => { if (e.key === "Escape") finish(); });
  window.__fx = { start, draw, build, makeSub: () => { build(); return makeSub(); } };   /* 動作確認用 */
})();

/* ---------- 起動 ---------- */
renderLinks();
renderContact();
load();
spy();
</script>
